<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale Officina</title>
<meta name="theme-color" content="#171C21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E-Duck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>try{var _t=localStorage.getItem("officina_tema");if(_t=="light"||_t=="dark")document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Officina: barra fissa con nastro di sicurezza, contenuti larghi; lavori in tre colonne su schermo grande */
:root{--yb:#fff3bf;--yl:#d99400;--rb:#ffe3e3;--rl:#e03131;--gb:#d3f9d8;--gl:#2f9e44;
--bg:#ECEFF2;--card:#fff;--sunk:#F4F6F8;--tx:#171C21;--mu:#5B6570;--bd:#D3D9DF;--ac:#F2B100;--acx:#171C21;--dn:#C2362B;
--fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--yb:rgba(245,159,0,.18);--yl:#f5b31a;--rb:rgba(224,49,49,.2);--rl:#f06a5e;--gb:rgba(47,158,68,.2);--gl:#3dc27b;
--bg:#111417;--card:#1A1F24;--sunk:#14181C;--tx:#E8ECF0;--mu:#98A3AE;--bd:#2B323A;--ac:#FFC21A;--acx:#111417;--dn:#F06A5E;color-scheme:dark}}
:root[data-theme="dark"]{--yb:rgba(245,159,0,.18);--yl:#f5b31a;--rb:rgba(224,49,49,.2);--rl:#f06a5e;--gb:rgba(47,158,68,.2);--gl:#3dc27b;
--bg:#111417;--card:#1A1F24;--sunk:#14181C;--tx:#E8ECF0;--mu:#98A3AE;--bd:#2B323A;--ac:#FFC21A;--acx:#111417;--dn:#F06A5E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 var(--fb)}
main{max-width:1400px;margin:0 auto;padding:22px 28px 48px}
h1{font:700 2rem/1 var(--fd);text-transform:uppercase;margin:0 0 14px}
h2{font:700 1.45rem/1.1 var(--fd);text-transform:uppercase;letter-spacing:.02em;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sunk);color:var(--tx);font:inherit}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{padding:11px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:600 1rem var(--fb);cursor:pointer}
button:hover{border-color:var(--tx)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button.d{color:var(--dn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:150px}
.item{display:flex;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border:0}
.item:hover{background:var(--sunk)}
input[type=checkbox]{width:auto;transform:scale(1.4);margin:0 4px;accent-color:var(--tx)}
.job{border-left:7px solid;border-bottom:0;border-radius:8px;margin-bottom:8px}
.job.j0,.job.j0:hover{background:var(--yb);border-color:var(--yl)}
.job.j1,.job.j1:hover{background:var(--rb);border-color:var(--rl)}
.job.j2,.job.j2:hover{background:var(--gb);border-color:var(--gl)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
@media(max-width:1100px){.board{grid-template-columns:minmax(0,1fr)}}
.chk{display:flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--card);font-weight:600}
.dt{display:flex;align-items:center;gap:6px}
.dt input{width:auto}
#bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--ac) 0 14px,var(--tx) 14px 28px)}
.wrapbar{max-width:1400px;margin:0 auto;padding:12px 28px}
.brandrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font:700 1.75rem/1 var(--fd);text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none}
.brand i{font-style:normal}
.brand span{background:var(--ac);color:var(--acx);padding:0 .15em}
.tema{flex:0 0 auto;white-space:nowrap}
.ver{flex:0 0 auto;padding:3px 8px;border-radius:999px;font:700 .75rem var(--fm);background:var(--sunk);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.ver.new{background:var(--ac);color:var(--acx);border-color:var(--ac);animation:verpulse 1.6s ease-in-out infinite}
.ver .vm{display:none}
@media (max-width:700px){.ver .vd{display:none}.ver .vm{display:inline}.brand{flex:0 1 auto}.brandrow #ver{margin-right:auto}}
@keyframes verpulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.ver.new{animation:none}}
.tema .ti{display:none}
.sync{flex:0 0 auto;font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--mu)}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--gl)} .sync.busy{color:var(--yl)} .sync.off{color:var(--rl)}
.login{max-width:560px;margin:8vh auto;text-align:left;padding:28px}
.login h2{margin-top:0}
.login-logo{display:block;width:min(320px,80%);margin:0 auto 14px;border-radius:12px}
.brand.big{font-size:2.6rem;margin-bottom:14px;cursor:default}
.imp{border:2px solid var(--ac)}
.brandrow #q{flex:1;min-width:220px;font-size:1.05rem}
#newbox .card{margin:12px 0 0}
.mu{color:var(--mu);font-size:.92rem}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:3px solid var(--tx);margin:14px 0}
.tab{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--mu);white-space:nowrap;padding:10px 16px;font:700 1.15rem var(--fd);text-transform:uppercase;letter-spacing:.02em}
.tab.on{background:var(--tx);color:var(--bg)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mu);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
td input{padding:8px}
div.tot{text-align:right;font-weight:700;margin-top:10px;font-family:var(--fm)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr};main,.wrapbar{padding-left:16px;padding-right:16px}}
/* ===== Preventivi di vendita ===== */
:root{--pc:#3d5b75;--pt:#a3acb6;--pk:#F4F6F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pc:#6e94b8;--pt:#55606b;--pk:#191c20}}
:root[data-theme="dark"]{--pc:#6e94b8;--pt:#55606b;--pk:#191c20}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pv-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px;align-items:start}
@media(max-width:860px){.pv-grid{grid-template-columns:minmax(0,1fr)}}
.pv-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-col .card,.pv-side .card{margin:0}
.pv-h{display:flex;align-items:center;gap:10px;font:700 1.4rem/1 var(--fd);text-transform:uppercase;margin:0 0 12px}
.pv-n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--tx);color:var(--bg);font:700 .85rem var(--fm)}
.pv-f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--mu);flex:1 1 130px;min-width:0}
.pv-f.w2{flex:2 1 200px}
.pv-f select,.pv-sel{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.pv-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.num{font-family:var(--fm);text-align:right}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--bg);flex:0 0 auto}
.seg button{border:0;border-radius:0;background:transparent;color:var(--mu);font-weight:600;font-size:.88rem;padding:10px 11px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.pv-seg{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--mu)}
.pv-line{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--mu)}
.pv-line b{color:var(--tx);font-family:var(--fm)}
.pv-sp{border:1px dashed var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.pv-sp .tg{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pv-sp .tg button{padding:4px 8px;font-size:.8rem}
.pv-sub{font-size:.82rem;color:var(--mu)} .pv-sub b{color:var(--tx);font-family:var(--fm)}
.pv-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pv-add button{padding:7px 11px;font-size:.9rem}
.pv-mode{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pv-mode button{flex:1 1 150px;text-align:left;font-weight:600}
.pv-mode button small{display:block;font-weight:400;font-size:.78rem;color:var(--mu)}
.pv-mode button[aria-selected="true"]{border-color:var(--tx);box-shadow:inset 0 -3px 0 var(--ac)}
.pv-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media(max-width:860px){.pv-side{position:static}}
.pv-tk{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.pv-tk .top{padding:14px;border-bottom:2px dashed var(--bd)}
.pv-st{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid currentColor}
.pv-st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pv-st.good{color:var(--gl)} .pv-st.warn{color:var(--yl)} .pv-st.bad{color:var(--rl)}
.pv-lbl{font-size:.75rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 2px}
.pv-big{font:700 3rem/1 var(--fm);letter-spacing:-.02em}
.pv-big.neg{color:var(--rl)}
.pv-kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pv-kp div{background:var(--pk);border-radius:8px;padding:8px 10px}
.pv-kp span{display:block;font-size:.72rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pv-kp b{font:700 1.15rem var(--fm)}
.pv-pr{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;background:var(--tx);color:var(--bg);border-radius:8px;padding:10px 12px}
.pv-pr span{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.pv-pr b{font:700 1.5rem var(--fm)}
.pv-pr small{width:100%;font-size:.78rem;opacity:.75}
.pv-bw{padding:12px 14px;border-bottom:2px dashed var(--bd)}
.pv-bar{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--pk)}
.pv-bar i{display:block;height:100%;transition:width .25s}
.pv-lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.8rem;color:var(--mu)}
.pv-lg span{display:inline-flex;align-items:center;gap:5px}
.pv-lg span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.pv-tb{padding:4px 14px 12px}
.pv-tb table{min-width:0;font-size:.88rem}
.pv-tb td{padding:6px 0}
.pv-tb td:last-child{text-align:right;font-family:var(--fm);white-space:nowrap;padding-left:8px}
.pv-tb tr.sec td{border:0;padding-top:12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.pv-tb tr.tot td{font-weight:700}
.pv-note{font-size:.82rem;color:var(--mu)}
.pv-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;border:1px solid var(--bd);color:var(--mu)}
.pv-badge.b1{color:var(--yl);border-color:var(--yl)} .pv-badge.b2{color:var(--gl);border-color:var(--gl)} .pv-badge.b3{color:var(--rl);border-color:var(--rl)}
.pv-saved{font-size:.82rem;color:var(--gl);font-weight:600}
.job{flex-wrap:wrap;transition:box-shadow .2s,transform .2s}
.item.job,.item.job:last-child{border-left-width:7px;border-left-style:solid}
.job>div:first-child{flex:1 1 auto;min-width:0}
.job.open{box-shadow:0 10px 28px rgba(0,0,0,.18);transform:scale(1.02);position:relative;z-index:2}
.jdet{flex:1 1 100%;display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.job.open .jdet{grid-template-rows:1fr}
.jdet-in{overflow:hidden;min-height:0}
.job.open .jdet-in{border-top:1px dashed currentColor;border-color:rgba(127,127,127,.4);margin-top:10px;padding-top:10px}
.jd-note{font-size:.9rem;font-style:italic;margin-bottom:8px}
.jd-lbl{font:700 .75rem var(--fb);text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:4px}
.jd-list{list-style:none;margin:0;padding:0}
.jd-list li{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid rgba(127,127,127,.2);font-size:.95rem}
.jd-d{font-family:var(--fm);font-size:.85rem;color:var(--mu);flex:0 0 auto}
.jd-t{flex:1;min-width:0}
.jd-c{font-family:var(--fm);font-size:.9rem;flex:0 0 auto}
.jd-sum{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;margin-top:8px;font-size:.92rem}
.jd-hint{font-size:.8rem;color:var(--mu);margin-top:6px;text-align:right}
@media (prefers-reduced-motion:reduce){.job,.jdet{transition:none}.job.open{transform:none}}
/* ===== Report consegne ===== */
:root{--cy:#B07800;--py:#2A78D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cy:#A87300;--py:#3987E5}}
:root[data-theme="dark"]{--cy:#A87300;--py:#3987E5}
.rp-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.rp-seg button{padding:10px 18px;font-size:1rem}
.rp-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp-nav button{min-width:44px;font-size:1.1rem}
.rp-per{font:700 1.5rem/1 var(--fd);text-transform:uppercase;min-width:240px;text-align:center}
.rp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:900px){.rp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rp-kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.rp-kpi span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.rp-kpi b{font:700 1.6rem/1.1 var(--fm);font-variant-numeric:tabular-nums}
.rp-kpi.main{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.rp-kpi.main span{color:inherit;opacity:.75}
.rp-kpi.main b{font-size:2rem}
.rp-kpi em{font-style:normal;font-weight:700;font-size:.9rem;color:var(--mu)}
.rp-kpi em.up{color:var(--gl)} .rp-kpi em.down{color:var(--rl)}
.rp-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.rp-split .card{margin:0}
@media(max-width:1000px){.rp-split{grid-template-columns:minmax(0,1fr)}}
.rp-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rp-wd{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);text-align:center;padding:2px 0 4px}
.rp-day{position:relative;min-height:84px;border:1px solid var(--bd);border-radius:8px;background:var(--sunk);padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--tx);overflow:hidden}
.rp-day.empty{border:0;background:transparent}
.rp-day.has{background:color-mix(in srgb,var(--cy) calc(var(--a,0) * 100%),var(--card));border-color:var(--cy)}
.rp-day.today{outline:2px solid var(--tx);outline-offset:1px}
.rp-dn{font:700 .95rem var(--fm)}
.rp-dv{font:700 .82rem var(--fm);margin-top:auto;white-space:nowrap}
.rp-dc{font-size:.72rem;color:var(--mu)}
.rp-day.has .rp-dc{color:inherit;opacity:.8}
.rp-groups{display:flex;flex-direction:column;gap:12px;max-height:620px;overflow:auto}
.rp-group{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.rp-gh{display:flex;gap:10px;align-items:baseline;padding:9px 12px;background:var(--sunk);cursor:pointer;border-bottom:1px solid var(--bd)}
.rp-gd{font:700 1.05rem var(--fd);text-transform:uppercase;letter-spacing:.02em}
.rp-gt{margin-left:auto;font-family:var(--fm)}
.rp-it{padding:10px 12px}
.rp-it .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-v{font-family:var(--fm);white-space:nowrap}
.rp-months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:800px){.rp-months{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rp-mo{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;background:var(--sunk)}
.rp-mo.today{outline:2px solid var(--tx);outline-offset:1px}
.rp-mn{font:700 1.1rem var(--fd);text-transform:uppercase}
.rp-mv{font:700 1.3rem var(--fm)}
.rp-mb{display:block;width:100%;height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:4px}
.rp-mb i{display:block;height:100%;background:var(--cy);border-radius:3px}
.rp-chart{margin-top:14px}
.rp-ch-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.rp-lg{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem;font-weight:600}
.rp-lg span{display:inline-flex;align-items:center;gap:6px}
.rp-lg span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.rp-svgw{position:relative}
.rp-svgw svg{width:100%;height:auto;display:block}
.rp-grid{stroke:var(--bd);stroke-width:1}
.rp-base{stroke:var(--mu);stroke-width:1}
.rp-ax{fill:var(--mu);font:12px var(--fb)}
.rp-bc{fill:var(--cy)} .rp-bp{fill:var(--py)}
.rp-hl{fill:transparent;cursor:pointer}
.rp-hl.on{fill:var(--sunk)}
.rp-tip{position:absolute;transform:translate(-50%,calc(-100% - 6px));background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;box-shadow:0 6px 18px rgba(0,0,0,.15);font-size:.88rem;pointer-events:none;white-space:nowrap;z-index:3}
.rp-tip div{display:flex;align-items:center;gap:6px}
.rp-tip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rp-tip b{font-family:var(--fm);margin-left:auto;padding-left:10px}
.rp-tbl{margin-top:10px}
.rp-tbl summary{cursor:pointer}
.rp-tbl td.num{text-align:right;font-family:var(--fm)}
.ord{margin-left:auto}
.rp-bc,.rp-bp{pointer-events:none}

/* ===== Telefono ===== */
.rp-dvs{display:none}
